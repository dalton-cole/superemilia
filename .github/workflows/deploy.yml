name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Check the game script
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html = fs.readFileSync('public/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw new Error('The game script is missing.');
          new Function(script);
          console.log('Game script syntax passed.');
          JS
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the game
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
